@let flight = item();

<div [class.selected]="selected()" class="card">
  <div class="card-header">
    <h2 class="title">{{ flight.from }} - {{ flight.to }}</h2>
  </div>
  <div class="card-body">
    <p>Flight-No.: #{{ flight.id }}</p>
    <p>Date: {{ flight.date | date }}</p>
    <p>Delayed: {{ flight.delayed }}</p>
    <div>
      @if (!selected()) {
        <button (click)="select()">Select</button>
      } @else {
        <button (click)="deselect()">Remove</button>
      }
    </div>

    <br/>

    <!-- Place for projected content -->
    <ng-content>
      <!-- This content is shown if no content is projected -->
      <p>No additional information provided.</p>
    </ng-content>

    <!-- Placeholder for projected content with class="extra-detail" -->
    <ng-content select=".extra-detail" />
  </div>
</div>
