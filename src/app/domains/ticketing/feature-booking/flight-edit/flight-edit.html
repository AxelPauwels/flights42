@if (flight().id !== 0) {
	<app-validation-errors-pane [errors]="flightForm().errors()" />
	<form class="flight-form" novalidate>
		<app-flight-form [flight]="flightForm"></app-flight-form>
		<app-aircraft-form [aircraft]="flightForm.aircraft"></app-aircraft-form>
		<app-prices-form [prices]="flightForm.prices"></app-prices-form>
		<div class="mt-40">
			<button>Save</button>
		</div>
	</form>
}
